<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>View Raffle</title>
  <!-- Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="text-center mb-4">Prize Details</h2>

          <!-- Prize name -->
          <div class="mb-3">
            <h4>Prize Name</h4>
            <p th:text="${raffle.name}">Example Prize Name</p>
          </div>

          <!-- Prize photo placeholder -->
<!--          <div class="mb-3">-->
<!--            <h4>Prize Photo</h4>-->
<!--            <div class="border bg-light text-center p-5">-->
<!--              <span class="text-muted">Photo not available</span>-->
<!--            </div>-->
            <!-- Later you can replace with:
            <img th:src="@{/images/{id}(id=${raffle.id})}" class="img-fluid rounded" alt="Prize photo">
            -->
<!--          </div>-->

          <!-- Apply button -->
          <div class="d-grid">
            <a th:href="@{/raffle/{id}/apply(id=${raffle.id})}" class="btn btn-success">Apply</a>
          </div>

          <!-- Back to raffles -->
          <div class="d-grid mt-2">
            <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS via CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
