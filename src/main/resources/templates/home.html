<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Home</title>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .apply-button {
            background-color: #DDFF99;
            color: black;
            border-color: #99E600;
        }

        .apply-button:hover {
            background-color: #99E600;
            border-color: #99E600;
            color: black;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5" sec:authorize="hasRole('USER')">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="mb-3">Welcome, <span sec:authentication="name">User</span>!</h1>
                    <p class="text-muted">You have successfully logged in.</p>

                    <!-- Admin-only raffle form -->
                    <div sec:authorize="hasRole('ADMIN')" class="mb-4">
                        <h4>Create New Raffle</h4>
                        <form method="POST" th:action="@{/raffle}" modelAttribute="newRaffle">
                            <div class="mb-3">
                                <label for="name" class="form-label"><strong>Name</strong></label>
                                <input type="text" id="name" name="raffleName" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </form>
                    </div>

                    <!-- Raffle table -->
                    <h4 class="mb-3">Available Raffles</h4>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Name</th>
                                <th scope="col"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="raffle, stat : ${raffles}">
                                <td th:text="${raffle.id}">raffle_ID</td>
                                <td th:text="${raffle.name}">raffle_name</td>
                                <td class="text-center align-middle">
                                    <a th:href="@{/raffle/{id}(id=${raffle.id})}"
                                       class="btn btn-sm btn-outline-primary">View</a>
                                    <a th:href="@{/raffle/{id}(id=${raffle.id})}"
                                       th:text="${raffle.closed} ? 'Closed' : 'Apply'"
                                       th:classappend="${raffle.closed} ? 'disabled' : ''"
                                       class="btn btn-sm btn-outline-primary apply-button">Button text placeholder</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-end mt-2">
                        <!-- Logout button on the right -->
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-danger">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS via CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
