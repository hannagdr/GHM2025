<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
<head>
    <title>View Raffle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" th:object="${raffle}">
    <!-- Top row: Inputs and Buttons -->
    <div class="row mb-3">
        <!-- Text inputs -->
        <div class="col-md-9">
            <div class="d-flex flex-column gap-2">
                <div class="form-control bg-light" th:text="${raffle.name}">raffle.name</div>
                <div class="form-control bg-light" th:text="|Prize: ${raffle.prize.name} (${raffle.prize.category})|">
                    prize.name
                </div>
                <div class="form-control bg-light" th:text="|Number of applicants: ${raffle.playerNames.size()}|">
                    raffle.applicants
                </div>
            </div>
        </div>
        <!-- Buttons -->
        <div class="col-md-3 d-flex flex-column justify-content-start gap-2">
            <button class="btn btn-primary">button.admin.draw</button>
            <button class="btn btn-secondary">button.admin.close</button>
            <button class="btn btn-success">button.user.apply</button>
            <button class="btn btn-success">button.back</button>
        </div>
    </div>

    <!-- List area -->
    <div class="row">
        <div class="col">
            <div class="border rounded p-3 bg-light" style="min-height: 200px;">
                <h5>List of applicants</h5>
                <!-- Replace with dynamic content -->
                <ul class="list-group">
                    <li class="list-group-item">applicant_one</li>
                    <li class="list-group-item">applicant_two</li>
                    <li class="list-group-item">applicant_thee</li>
                </ul>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
