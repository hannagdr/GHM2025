<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<html>
<head>
    <title>View Raffle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/common.css}" rel="stylesheet">
    <script th:src="@{/js/common.js}"></script>
</head>
<body class="bg-light">
<div class="container py-4" th:object="${raffle}">
    <!-- Top row: Inputs and Buttons -->
    <div class="row mb-3">
        <!-- Text inputs -->
        <div class="col-md-9">
            <div class="d-flex flex-column gap-2">
                <div class="form-control bg-light" th:text="${raffle.name}">raffle.name</div>
                <div class="form-control bg-light" th:text="|Prize: ${raffle.prize.name} (${raffle.prize.category})|">
                    prize.name
                </div>
                <div class="form-control bg-light" th:text="|Number of applicants: ${raffle.playerNames.size()}|">
                    raffle.applicants
                </div>
            </div>
        </div>
        <!-- Buttons -->
        <div class="col-md-3 d-flex flex-column justify-content-start gap-2">
            <button sec:authorize="hasRole('ADMIN')"
                    th:hidden="${raffle.closed}"
                    class="btn btn-primary">Draw
            </button>

            <button sec:authorize="hasRole('ADMIN')"
                    th:hidden="${raffle.closed}"
                    class="btn btn-danger">Close
            </button>

            <button class="btn btn-outline-primary apply-button"
                    th:attr="data-id=${raffle.id}"
                    th:classappend="${raffle.closed} ? 'disabled' : ''"
                    th:hidden="${(#authorization.expression('hasRole(''ADMIN'')')) && !raffle.closed}"
                    th:text="${!raffle.closed} ? 'Apply' : (${raffle.canceled} ? 'Canceled' : 'Closed')">button.apply
            </button>

            <button class="btn btn-secondary" onclick="history.back()">Back</button>
        </div>
    </div>

    <div class="row" sec:authorize="hasRole('ADMIN')">
        <div class="col">
            <div class="border rounded p-3 bg-light">
                <h5>List of applicants</h5>
                <ul class="list-group" th:each="playerName, stat : ${raffle.getPlayerNames()}">
                    <li class="list-group-item" th:text="${playerName}">player.name</li>
                </ul>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
