<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <!-- Bootstrap CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 th:text="${raffle.id != null} ? 'Edit raffle' : 'Create new raffle'"
                        class="text-center mb-4">title.placeholder</h2>
                    <!-- Login form -->
                    <form th:action="@{/raffle}" method="post" th:object="${raffle}">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label for="name" class="form-label">Raffle name</label>
                            <input type="text" id="name" class="form-control" required th:field="*{name}">
                        </div>
                        <div class="mb-3">
                            <label for="prize" class="form-label">Choose a prize</label>
                            <select id="prize" class="form-select" th:field="*{prizeId}">
                                <option th:each="p : ${prizes}"
                                        th:value="${p.id}"
                                        th:text="${p.name}">
                                </option>
                            </select>
                        </div>
                        <div class="d-grid mb-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="${raffle.id != null} ? 'Save' : 'Create'">button.submit
                            </button>
                        </div>
                        <div class="d-grid mb-2">
                            <button type="button" class="btn btn-secondary" onclick="history.back()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS via CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
